# Render Blueprint — HVA-Signal (3K Labs) Free-tier public validation.
#
# Free services sleep when idle and cannot use private-network hostport.
# This is validation infrastructure, not the judged-demo plan.
# Leave FORTYGUARD_API_KEY empty. DATA_MODE is replay.
#
# Canonical copy also lives at infra/render.yaml.

services:
  - type: web
    name: urban-thermal-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATA_MODE
        value: replay
      - key: LOG_LEVEL
        value: info
      - key: CACHE_DIR
        value: /tmp/fortyguard-cache
      - key: FORTYGUARD_API_KEY
        sync: false
      - key: FORTYGUARD_BASE_URL
        value: https://api.fortyguard.com
      - key: API_PUBLIC_URL
        fromService:
          name: urban-thermal-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: WEB_PUBLIC_URL
        fromService:
          name: urban-thermal-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ALLOWED_ORIGINS
        fromService:
          name: urban-thermal-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: urban-thermal-web
    runtime: docker
    plan: free
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "10000"
      - key: API_UPSTREAM
        fromService:
          name: urban-thermal-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: WEB_PUBLIC_URL
        fromService:
          name: urban-thermal-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

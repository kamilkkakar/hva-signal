name: HVA-Signal CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      DATA_MODE: replay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest
      - name: Smoke /health and /ready
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          bash ../../scripts/smoke-api.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build

  playwright:
    runs-on: ubuntu-latest
    env:
      DATA_MODE: replay
      API_BASE_URL: http://127.0.0.1:8000
      WEB_BASE_URL: http://127.0.0.1:4173
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "./apps/api[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Start API and web preview, then run e2e
        run: |
          (cd apps/api && uvicorn app.main:app --host 127.0.0.1 --port 8000) &
          (cd apps/web && npm run preview -- --host 127.0.0.1 --port 4173) &
          bash scripts/smoke-api.sh
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          npm run test:e2e

# Render Blueprint — HVA-Signal (3K Labs) Free-tier public validation.
#
# Canonical deployment source: infra/render.yaml. Root render.yaml is a
# required byte-identical copy (unit test enforces this). Do not edit one
# without the other.
#
# Free services sleep when idle and cannot use private-network hostport.
# DATA_MODE remains replay for the published product. GENERAL hosted/vendor
# construction stays OFF. Only the narrow cache-first selected-time endpoint is
# enabled; it accepts supported city + exact local hour and keeps AOI/provider
# configuration server-owned.

services:
  - type: web
    name: urban-thermal-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATA_MODE
        value: replay
      - key: LOG_LEVEL
        value: info
      - key: CACHE_DIR
        value: /tmp/fortyguard-cache
      - key: FORTYGUARD_API_KEY
        sync: false
      - key: FORTYGUARD_BASE_URL
        value: https://api.fortyguard.com
      - key: HOSTED_LIVE_ENABLED
        value: false
      - key: HOSTED_LIVE_REAL_VENDOR_ENABLED
        value: false
      - key: BOUNDED_SELECTED_TIME_LIVE_ENABLED
        value: true
      - key: BOUNDED_SELECTED_TIME_DAILY_LIMIT
        value: "20"
      - key: DEMO_ALLOWANCE_ENABLED
        value: false
      - key: DEMO_ALLOWANCE_MAX_TOTAL_UNITS
        value: 0
      - key: HVA_PUBLIC_CONTEXT
        value: 1
      - key: HVA_PUBLIC_TEMPORAL_STORIES
        value: 1
      - key: HVA_PUBLIC_TWO_SIGNAL
        value: 0
      - key: HVA_PUBLIC_GEOGRAPHY
        value: 0
      - key: HVA_PUBLIC_SAFETY_MIDDLEWARE
        value: 1
      - key: OPERATOR_APPROVAL_ENABLED
        value: false
      - key: LOCAL_SQLITE_PERSISTENCE_ENABLED
        value: false
      - key: API_PUBLIC_URL
        fromService:
          name: urban-thermal-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: WEB_PUBLIC_URL
        fromService:
          name: urban-thermal-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ALLOWED_ORIGINS
        fromService:
          name: urban-thermal-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: urban-thermal-web
    runtime: docker
    plan: free
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "10000"
      - key: API_UPSTREAM
        fromService:
          name: urban-thermal-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_HVA_JUDGE_SHELL
        value: "1"
      - key: WEB_PUBLIC_URL
        fromService:
          name: urban-thermal-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

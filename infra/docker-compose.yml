# Compose HVA-Signal production images (local). Public validation hosting is Render Free — see infra/DEPLOY.md.
services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: production
      DATA_MODE: replay
      LOG_LEVEL: ${LOG_LEVEL:-info}
      FORTYGUARD_API_KEY: ${FORTYGUARD_API_KEY:-}
      FORTYGUARD_BASE_URL: ${FORTYGUARD_BASE_URL:-https://api.fortyguard.com}
      HOSTED_LIVE_ENABLED: "false"
      HOSTED_LIVE_REAL_VENDOR_ENABLED: "false"
      DEMO_ALLOWANCE_ENABLED: "false"
      DEMO_ALLOWANCE_MAX_TOTAL_UNITS: "0"
      HVA_PUBLIC_CONTEXT: "1"
      HVA_PUBLIC_TEMPORAL_STORIES: "1"
      HVA_PUBLIC_TWO_SIGNAL: "0"
      HVA_PUBLIC_GEOGRAPHY: "0"
      HVA_PUBLIC_SAFETY_MIDDLEWARE: "1"
      OPERATOR_APPROVAL_ENABLED: "false"
      LOCAL_SQLITE_PERSISTENCE_ENABLED: "false"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:8080}
      CACHE_DIR: ${CACHE_DIR:-/tmp/fortyguard-cache}
      PORT: "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ../apps/web
    environment:
      PORT: "80"
      API_UPSTREAM: api:8000
    ports:
      - "8080:80"
      - "18080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:80",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
